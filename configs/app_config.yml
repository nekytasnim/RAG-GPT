directory:
  persist_directory: data/vectordb/processed/chroma

cloudflare:
  bucket_name: rag-gpt-documents
  processed_ prefix: pre-processed/
  uploads_prefix: uploads/

embedding_model_config:
  engine: "nvidia/nemotron-3-embed-1b:free"

llm_config:
  llm_system_role: "You are a chatbot. You'll receive a prompt that icludes chat history, retrieved content from the vectorDB based on the user's question, and the source. Your task is to respond to the user's new question using the information from the vetcorDB without relying on your own knowledge. You will receive a prompt with the following format:
  
  # Chat history: 
    [user query, response]
  
  # Retrieved content number: 
    Content
    Source

  # User question: 
    New question"
  engine: "openai/gpt-oss-120b:free"
  temperature: 0.0

summarizer_config:
  max_final_token: 3000
  character_overlap: 100
  token_threshold: 0
  summarizer_llm_system_role: "You are an expert text summarizer. You wil receive a text and your task is to summarize and keep all the ley information. Keep the maximum length of summary within {} number of tokens."
  final_summarizer_llm_system_role: "You are an expert text summarizer. You will receive a text and your task is to give a comprehensive sumary and keep all the key information."

splitter_config:
  chunk_size: 1500
  chunk_overlap: 500

retrieval_config:
  k: 3

memory:
  number_of_q_a_pairs: 2